<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <h1>Генератор паролей</h1>

        <div class="password-box">
            <input type="text" id="password" readonly placeholder="Нажмите «Сгенерировать»" />
            <button id="copyBtn">Копировать</button>
        </div>

        <div class="settings">
            <div class="setting-row">
                <label for="length">Длина:</label>
                <div>
                    <input type="range" id="length" min="4" max="32" value="12" />
                    <span id="lengthValue">12</span>
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="useUppercase" checked />
                    A-Z
                </label>
                <label>
                    <input type="checkbox" id="useLowercase" checked />
                    a-z
                </label>
                <label>
                    <input type="checkbox" id="useNumbers" checked />
                    0-9
                </label>
                <label>
                    <input type="checkbox" id="useSymbols" />
                    !@#$%
                </label>
            </div>
        </div>

        <button id="generateBtn">Сгенерировать</button>

        <div class="strength">
            <span id="strengthText">Сложность: —</span>
            <div class="strength-bar">
                <div class="fill" id="strengthFill"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
